<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="No profile photo">
  <title>No profile photo</title>

  <!-- Rectangular to match the card's image frame, with a flat background so
       it still reads correctly when the card crops it to another aspect ratio.
       A neutral silhouette rather than a photograph: these are demo profiles,
       and a real person's face on an invented profile reads as impersonation.
       Greys are tinted toward the site's sage palette so it belongs to the
       page rather than looking like a missing asset. -->

  <rect width="400" height="300" fill="#D4DAD3" />

  <g fill="#9BA89D">
    <!-- head -->
    <circle cx="200" cy="120" r="46" />
    <!-- shoulders: a wide arc, cropped by the frame the way Facebook's is -->
    <path d="M200 180c-52 0-94 38-99 88h198c-5-50-47-88-99-88z" />
  </g>
</svg>
